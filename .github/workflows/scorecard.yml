name: Scorecard recorder and monitor
# Once an hour: mark what happened to earlier ENTER calls, record new ones, and commit public/scorecard.json.
# The site redeploys from that commit, so the public scorecard updates itself. Read-only market data; no keys, no trades.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scorecard
  cancel-in-progress: false
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rule tests for the scorecard
        run: node --test tests/phase3.test.mjs
      - name: Record
        run: node scripts/scorecard.mjs
      - name: Commit the scorecard
        run: |
          # The hosting plan only deploys commits authored by the project owner, so the recorder commits in the owner's
          # name, taken from the latest commit a person made. The message says plainly that it is automated.
          OWNER=$(git log -30 --format='%an|%ae' | grep -v 'scorecard@users.noreply.github.com' | head -1)
          git config user.name "${OWNER%%|*}"
          git config user.email "${OWNER##*|}"
          git add public/scorecard.json
          git diff --cached --quiet && exit 0
          git commit -m "Scorecard: automated recorder run $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      - name: Is the live site healthy?
        # A failure here fails the run, and GitHub emails the repository owner. Nothing is retried or hidden.
        run: node scripts/monitor.mjs
