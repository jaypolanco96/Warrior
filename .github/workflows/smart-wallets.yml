name: Smart wallet list
# Every six hours: rebuild public/smart-wallets.json from the last three and a half days of pumps (scripts/smart-wallets.mjs).
# Read-only public market data; no keys, no trades.
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: smart-wallets
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the list
        run: node scripts/smart-wallets.mjs
      - name: Commit the list
        run: |
          # Committed in the owner's name for the same reason as the scorecard; the message says it is automated.
          OWNER=$(git log -30 --format='%an|%ae' | grep -v 'noreply@anthropic.com' | grep -v 'scorecard@users.noreply.github.com' | head -1)
          git config user.name "${OWNER%%|*}"
          git config user.email "${OWNER##*|}"
          git add public/smart-wallets.json
          git diff --cached --quiet && exit 0
          git commit -m "Smart wallets: automated list rebuild $(date -u +%Y-%m-%dT%H:%MZ)"
          # The scorecard may have pushed meanwhile.
          git pull --rebase origin main && git push
